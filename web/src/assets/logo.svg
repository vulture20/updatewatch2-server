<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fluent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50E6FF"/>
      <stop offset="45%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Komplettes Logo um 20 % vergrößert -->
  <g transform="translate(256 256) scale(1.2) translate(-256 -256)">

    <!-- Ring -->
    <circle
      cx="256"
      cy="256"
      r="150"
      fill="none"
      stroke="url(#fluent)"
      stroke-width="22"/>

    <!-- Hexagon -->
    <g filter="url(#shadow)">
      <path
        d="
          M256 125
          L356 182
          L356 330
          L256 387
          L156 330
          L156 182
          Z"
        fill="url(#fluent)"/>
    </g>

    <!-- Verbindungen -->
    <g
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-linecap="round">

      <line x1="256" y1="256" x2="210" y2="220"/>
      <line x1="256" y1="256" x2="302" y2="220"/>
      <line x1="256" y1="256" x2="210" y2="292"/>
      <line x1="256" y1="256" x2="302" y2="292"/>

    </g>

    <!-- Knoten -->
    <circle cx="210" cy="220" r="12" fill="#FFFFFF"/>
    <circle cx="302" cy="220" r="12" fill="#FFFFFF"/>
    <circle cx="210" cy="292" r="12" fill="#FFFFFF"/>
    <circle cx="302" cy="292" r="12" fill="#FFFFFF"/>

    <!-- Zentraler Hub -->
    <circle
      cx="256"
      cy="256"
      r="30"
      fill="#FFFFFF"/>

    <!-- Update-Symbol -->
    <g
      fill="none"
      stroke="#0078D4"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round">

      <path d="M247 245 A18 18 0 0 1 274 247"/>
      <polyline points="270,239 277,247 267,248"/>

      <path d="M265 267 A18 18 0 0 1 238 265"/>
      <polyline points="242,273 235,265 245,264"/>

    </g>

  </g>

</svg>