name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "src/**"
      - "web/**"
      - "docker/**"
      - "tests/**"
      - "scripts/**"
      - "VERSION"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "docker/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Excludes ActiveDirectoryLdapIntegrationTests (updatewatch2-server#13)
      # — those need a real LDAP server actually running (see the
      # dedicated ldap-integration-test job below), which this job
      # deliberately never sets up, so it stays fast for every ordinary
      # push/PR.
      - run: dotnet test --filter "Category!=LdapIntegration"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  # Real LDAP bind/search/group-membership coverage for
  # ActiveDirectoryAuthService (updatewatch2-server#13) — deliberately its
  # own job, not folded into `test` above, so pulling the OpenLDAP image
  # and standing up a real directory never slows down the fast path every
  # ordinary push/PR already takes. continue-on-error: true so a flaky
  # container start (or an actual regression here) never blocks
  # build/merge/release — the same "don't let the newer, less-certain
  # piece block the core pipeline" precedent the agent repo's own
  # release.yml already established for its optional linux-packages job.
  ldap-integration-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Start throwaway OpenLDAP test server
        run: scripts/run-ldap-test-server.sh up

      - run: dotnet test --filter "Category=LdapIntegration"

      - name: Stop throwaway OpenLDAP test server
        if: always()
        run: scripts/run-ldap-test-server.sh down

  # Builds and pushes one architecture's image at a time, by digest, never
  # by tag — a native GitHub-hosted runner per architecture (updatewatch2-server#23:
  # ubuntu-24.04-arm for linux/arm64, free for this public repo, same as
  # ubuntu-latest already was for linux/amd64) rather than
  # docker/setup-qemu-action emulation, since the issue's own analysis
  # found native builds meaningfully faster/more reliable for a .NET SDK
  # build than binfmt_misc emulation would be. A real tag/manifest list
  # gluing both architectures' digests together into one multi-arch image
  # only gets created once, by the merge job below, after every matrix leg
  # here has finished — pushing a tag directly from here would let
  # whichever leg finishes last silently overwrite the other's tag with a
  # single-arch image instead of a real multi-arch manifest.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Feeds a "vX.Y.Z" image tag from the project's own VERSION file
      # (CLAUDE.md's four-independent-version-numbers scheme) rather than
      # only tagging by git ref/sha. Only actually consumed for the
      # metadata-action call below (this job never applies a tag itself —
      # see the job comment), but read here anyway so both matrix legs
      # compute the exact same labels.
      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Compute a filesystem/cache-scope-safe platform pair (linux/arm64 -> linux-arm64)
        id: pair
        run: echo "value=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # cache-from/cache-to are scoped per platform pair — sharing one
      # scope across both matrix legs would let the arm64 and amd64 builds
      # overwrite each other's GHA cache entries every run instead of each
      # keeping its own.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ steps.pair.outputs.value }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.pair.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ steps.pair.outputs.value }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines both architectures' digests (uploaded above) into one real
  # multi-arch manifest list under the actual tags (latest/vX.Y.Z/sha-.../
  # the git tag) — nothing above this job ever pushes a tag itself, only a
  # bare digest, specifically so this is the one and only place a tag ever
  # gets written, avoiding the last-leg-wins race described on the build
  # job above. Skipped entirely on a pull_request, matching build's own
  # push=false there — there are no digests to merge when nothing was
  # pushed.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # DOCKER_METADATA_OUTPUT_JSON is an env var docker/metadata-action
      # exports automatically (alongside its usual step outputs) — the
      # documented pattern for feeding its computed tag list into
      # `buildx imagetools create` by digest, per Docker's own official
      # multi-platform-images CI guide.
      - name: Create and push the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect the published manifest list
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # A tag push used to publish the Docker image but never create a GitHub
  # Release to go with it — every server release before this had to be
  # backfilled by hand, unlike the agent repo's own release.yml, which
  # already does this on every tag. Mirrors that job's own shape exactly
  # (generate_release_notes: true, no files: — this repo has no
  # downloadable release artifact, only the container image published by
  # build/merge above).
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
